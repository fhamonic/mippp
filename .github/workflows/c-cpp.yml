name: C/C++ CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  linux-gcc15-build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.04
    steps:
      - uses: actions/checkout@v3
      - name: Install GCC-15, CMake and Git
        run: apt-get update && apt-get install -y gcc-15 g++-15 cmake git
      - name: Install open-source solvers
        run: apt-get install -y coinor-clp coinor-libclp-dev coinor-cbc coinor-libcbc-dev highs libhighs1 libglpk-dev
      - name: Install Conan 2.0
        run: |
          apt install -y pipx
          pipx install conan
          echo "/github/home/.local/bin" >> $GITHUB_PATH
      - name: Detect conan profile
        run: conan profile detect --name=default
      - name: Fetch Melon
        run: |
          git clone https://github.com/fhamonic/melon.git
          conan create melon -u -b=missing -pr=.github/conan-profiles/gcc15_c++26 -c tools.build:skip_test=true
      - name: Build and run unit tests
        env:
          MIPPP_REQUIRED_SOLVERS: "CLP;CBC;GLPK;HIGHS"
        run: |
          conan build . -of=build -b=missing -pr=.github/conan-profiles/gcc15_c++26

  linux-gcc14-build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v3
      - name: Install GCC-14, CMake and Git
        run: apt-get update && apt-get install -y gcc-14 g++-14 cmake git
      - name: Install open-source solvers
        run: apt-get install -y coinor-clp coinor-libclp-dev coinor-cbc coinor-libcbc-dev libglpk-dev
      - name: Install Conan 2.0
        run: |
          apt install -y pipx
          pipx install conan
          echo "/github/home/.local/bin" >> $GITHUB_PATH
      - name: Detect conan profile
        run: conan profile detect --name=default
      - name: Fetch Melon
        run: |
          git clone https://github.com/fhamonic/melon.git
          conan create melon -u -b=missing -pr=.github/conan-profiles/gcc14_c++23 -c tools.build:skip_test=true
      - name: Build and run unit tests
        env:
          MIPPP_REQUIRED_SOLVERS: "CLP;CBC;GLPK"
        run: |
          conan build . -of=build -b=missing -pr=.github/conan-profiles/gcc14_c++23

  linux-clang18-build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v3
      - name: Install Clang-18, listdc++-14, CMake and Git
        run: apt-get update && apt-get install -y clang-18 clang++-18 libstdc++-14-dev cmake git
      - name: Install open-source solvers
        run: apt-get install -y coinor-clp coinor-libclp-dev coinor-cbc coinor-libcbc-dev libglpk-dev
      - name: Install Conan 2.0
        run: |
          apt install -y pipx
          pipx install conan
          echo "/github/home/.local/bin" >> $GITHUB_PATH
      - name: Detect conan profile
        run: conan profile detect --name=default
      - name: Fetch Melon
        run: |
          git clone https://github.com/fhamonic/melon.git
          conan create melon -u -b=missing -pr=.github/conan-profiles/clang18_c++23 -c tools.build:skip_test=true
      - name: Build and run unit tests
        env:
          MIPPP_REQUIRED_SOLVERS: "CLP;CBC;GLPK"
        run: |
          conan build . -of=build -b=missing -pr=.github/conan-profiles/clang18_c++23

  linux-cmake-install:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.04
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v3
      - name: Install GCC-14, CMake and Git
        run: apt-get update && apt-get install -y gcc-14 g++-14 cmake git
      - name: Install the HiGHS solver
        run: apt-get install -y highs libhighs1
      - name: Install mippp
        run: |
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/prefix"
          cmake --install build
      - name: Build the simple_lp example against the installed package
        run: |
          cmake -S examples/simple_lp -B examples/simple_lp/build \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/prefix"
          cmake --build examples/simple_lp/build -j
      - name: Run the example and test output
        run: |
          ./examples/simple_lp/build/simple_lp | tee output.txt
          grep -q "objective = 27" output.txt

  windows-mingw15-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Conan 2.0
        run: pip install conan
      - name: Autodetect a default conan profile
        run: conan profile detect --name=default
      - name: Fetch Melon
        run: |
          git clone https://github.com/fhamonic/melon.git
          conan create melon -u -b=missing "-pr=.github/conan-profiles/mingw15_c++26" -c tools.build:skip_test=true
      - name: Fetch Highs
        run: |
          Invoke-WebRequest -Uri https://github.com/ERGO-Code/HiGHS/releases/download/v1.13.0/highs-1.13.0-x86_64-windows-mit.zip -OutFile highs.zip
          Expand-Archive -Path highs.zip -DestinationPath highs
      - name: Build and run unit tests
        env:
          MIPPP_HIGHS_LIBRARY: ${{ github.workspace }}\highs\bin\highs.dll
          MIPPP_REQUIRED_SOLVERS: "HIGHS"
        run: conan build . -of=build -b=missing "-pr=.github/conan-profiles/mingw15_c++26"
