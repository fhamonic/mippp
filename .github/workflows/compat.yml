name: Solver compatibility matrix

# Slow and network-dependent, so kept out of the PR workflow: it downloads a
# few hundred MB of released solver libraries and runs the suites against each.
on:
  schedule:
    # 04:00 UTC on the 1st of each month.
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Versions to test per solver"
        default: "6"
      solvers:
        description: "Comma-separated subset (empty = all open-source)"
        default: ""

jobs:
  matrix:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.04
    steps:
      - uses: actions/checkout@v3
      - name: Install GCC-15, CMake and Git
        run: apt-get update && apt-get install -y gcc-15 g++-15 cmake git curl zstd binutils
      - name: Install Conan 2.0
        run: |
          apt install -y pipx
          pipx install conan
          echo "/github/home/.local/bin" >> $GITHUB_PATH
      - name: Detect conan profile
        run: conan profile detect --name=default
      - name: Fetch Melon
        run: |
          git clone https://github.com/fhamonic/melon.git
          conan create melon -u -b=missing -pr=.github/workflows/gcc15_c++26 -c tools.build:skip_test=true
      # Every backend must be compiled in: the matrix only swaps the library the
      # binary dlopens, so one build serves every row.
      - name: Build the test binary
        run: conan build . -of=build -b=missing -pr=.github/workflows/gcc15_c++26
      - name: Run the compatibility matrix
        run: |
          python3 tools/compat_matrix.py run \
            --limit "${{ inputs.limit || 6 }}" \
            ${{ inputs.solvers && format('--solvers {0}', inputs.solvers) || '' }}
      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-results
          path: .compat-cache/results/
      - name: Open a pull request with the regenerated table
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: docs/solvers/compatibility.md
          branch: compat-matrix-update
          title: "Update the solver compatibility table"
          commit-message: "Update the solver compatibility table"
          body: |
            Regenerated by `.github/workflows/compat.yml`.

            A row turning ❌ means a released solver version stopped working
            with its wrapper; ⚠️ means it passed but skipped more than its
            siblings, or never ran at all — check the run's `compat-results`
            artifact for the per-test detail.
