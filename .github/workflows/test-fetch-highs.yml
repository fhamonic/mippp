name: Optional HiGHS test build

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  fetch-highs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Select GCC 14
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"
      - name: Configure without fetching
        run: cmake -S test/cmake/fetch_highs -B build/off -DCMAKE_BUILD_TYPE=Release
      - name: Test default behavior
        run: |
          cmake --build build/off --config Release --parallel 2
          ctest --test-dir build/off -C Release --output-on-failure
      - name: Configure the pinned solver
        run: cmake -S test/cmake/fetch_highs -B build/on -DCMAKE_BUILD_TYPE=Release -DMIPPP_TEST_FETCH_HIGHS=ON
      - name: Build and load the fetched solver
        run: |
          cmake --build build/on --config Release --parallel 2
          ctest --test-dir build/on -C Release --output-on-failure
